<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caminando Con Dulce</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app-wrapper">
        <div id="game-container">
            <!-- Barra superior informativa -->
            <div id="mensaje">Moka se fue a explorar sin permiso. Pista: Mira por la lámpara a ver si no se está electrocutando.</div>

            <!-- Globo de pistas interactivo (Pasos 1 y 2) -->
            <div id="globo-pista" class="globo-pista"></div>

            <!-- Hotspots Paso 1 (Moka) -->
            <div class="hotspot" style="top: 210px; left: 215px; width: 60px; height: 90px;"
                onclick="encontrarPistaMoka(1, event)"></div>
            <div class="hotspot" style="top: 40px; left: 10px; width: 120px; height: 320px;"
                onclick="encontrarPistaMoka(2, event)"></div>
            <div class="hotspot" style="top: 250px; left: 480px; width: 170px; height: 110px;"
                onclick="encontrarPistaMoka(3, event)"></div>

            <!-- Hotspots Paso 2 (Cremas) -->
            <div id="hotspots-cremas" style="display: none;">
                <div class="hotspot" style="top: 10px; left: 300px; width: 260px; height: 60px;"
                    onclick="encontrarPistaCremas(1, event)"></div>
                <div class="hotspot" style="top: 220px; left: 700px; width: 60px; height: 60px;"
                    onclick="encontrarPistaCremas(2, event)"></div>
                <div class="hotspot" style="top: 110px; left: 600px; width: 120px; height: 80px;"
                    onclick="encontrarPistaCremas(3, event)"></div>
            </div>

            <!-- Personajes en el parque -->
            <img id="moka-personaje" src="Images/Moka_4.png" style="top: 310px; left: 580px; width: 60px; z-index: 1;"
                alt="Moka">
            <img id="cremas-personaje" src="Images/Cremas_4.png"
                style="top: 110px; left: 600px; width: 55px; z-index: 4;" alt="Cremas">
            <img id="dulce-personaje" src="Images/Dulce_1.png" style="top: 260px; left: 150px; width: 90px; z-index: 2;"
                alt="Dulce">
            <img id="ximena-personaje" src="Images/Ximena_1.png"
                style="top: 245px; left: 580px; height: 150px; z-index: 3;" alt="Ximena">
            <img id="lucifer-personaje" src="Images/Lucifer_1.png"
                style="top: 348px; left: -100px; width: 62px; z-index: 4; display: none;" alt="Lucifer">

            <!-- Modal Paso 3: Sopa de Letras -->
            <div id="sopa-letras-container">
                <h3>✨ SOPA DE LETRAS ✨</h3>
                <p>Encuentra las 5 palabras ocultas (horizontal, vertical o diagonal):</p>
                <div class="grid-sopa" id="grid-sopa"></div>
                <div id="palabras-lista">
                    <span style="font-weight: bold; color: #fff; margin-right: 2px;">Palabras:</span>
                    <span class="palabra-item" id="p-XIMENA">XIMENA</span>
                    <span class="palabra-item" id="p-DULCE">DULCE</span>
                    <span class="palabra-item" id="p-CREMAS">CREMAS</span>
                    <span class="palabra-item" id="p-MOKA">MOKA</span>
                    <span class="palabra-item" id="p-LUCIFER">LUCIFER</span>
                </div>
                <div id="sopa-acciones">
                    <span id="sopa-progreso" style="color: #72efdd;">Encontradas: 0 / 5</span>
                    <div>
                        <button class="btn-sopa btn-sopa-omitir" onclick="omitirSopaDeLetras()" title="Botón temporal de desarrollo">⚡ Omitir</button>
                        <button class="btn-sopa" onclick="deseleccionarTodoSopa()">🧹 Limpiar</button>
                    </div>
                </div>
            </div>

            <!-- Modal Pasos 4 y 5: Quiz -->
            <div id="quiz-modal" class="modal-juego" style="display: none; top: 70px; left: 200px; width: 400px;"></div>

            <!-- Modal Paso 6: Minijuego de Ritmo ("A tu ritmo") -->
            <div id="ritmo-modal"></div>

            <!-- Capa Paso 7: Minijuego de Constelación ("Guía las Estrellas") -->
            <div id="constelacion-container"></div>

            <!-- Capa Paso 8: Minijuego de Sendero Iluminado -->
            <div id="sendero-container"></div>

            <!-- Modal Paso 10: Carta Final -->
            <div id="carta-final-modal" class="modal-juego"></div>
        </div>

        <!-- Aviso para rotar pantalla en móviles verticales -->
        <div id="orientacion-aviso">🔄 Gira tu pantalla para una mejor experiencia</div>
    </div>

    <!-- Script principal del juego -->
    <script src="js/script.js"></script>
</body>

</html>
